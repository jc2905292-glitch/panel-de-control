<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>REWARDS.WALLET - Tarjetas de Regalo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 414px; background-color: #ffffff; height: 100vh; position: relative; display: flex; flex-direction: column; overflow-y: auto; }
        
        header { padding: 20px; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; text-align: center; }
        .header-title { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
        
        .balance-card { background: white; margin: -20px 20px 20px 20px; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; z-index: 10; position: relative; }
        .balance-label { font-size: 14px; color: #888; margin-bottom: 5px; }
        .balance-amount { font-size: 40px; font-weight: bold; color: #1e2329; }
        .balance-amount span { font-size: 20px; color: #888; }
        
        .section-title { padding: 0 20px; font-size: 16px; font-weight: bold; color: #1e2329; margin-bottom: 15px; margin-top: 10px; }
        
        .giftcard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 80px 20px; }
        .giftcard-item { background: #1e2329; border-radius: 12px; padding: 15px; text-align: center; color: white; position: relative; overflow: hidden; cursor: pointer; }
        .giftcard-item::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent); transform: rotate(45deg); }
        .gc-amazon { background: linear-gradient(135deg, #ff9900, #ffb84d); }
        .gc-apple { background: linear-gradient(135deg, #000000, #434343); }
        .gc-visa { background: linear-gradient(135deg, #1a1f71, #f7b600); }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 414px; background: white; border-top: 1px solid #eaeaea; display: flex; justify-content: space-around; padding: 15px 0 25px 0; }
        .nav-item { font-size: 24px; color: #888; cursor: pointer; }
        .nav-item.active { color: #2575fc; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-title">REWARDS.WALLET</div>
            <p style="font-size: 12px; margin-top: 5px; opacity: 0.8;">Centro de Canje</p>
            <div style="height: 40px;"></div>
        </header>

        <div class="balance-card">
            <div class="balance-label">Fondos Disponibles para Canje</div>
            <div class="balance-amount"><span>$</span><span id="rewards-balance">0.00</span></div>
            <button onclick="actualizarSaldo()" style="margin-top:15px; background:#f0f2f5; border:none; padding:8px 15px; border-radius:8px; color:#888; font-weight:bold;">🔄 Actualizar Saldo</button>
        </div>

        <div class="section-title">Canjear por Gift Cards</div>
        <div class="giftcard-grid">
            <div class="giftcard-item gc-amazon" onclick="simularCanje('Amazon', 25)">
                <h3 style="margin-bottom: 5px;">Amazon</h3>
                <p style="font-size: 14px;">$25.00</p>
            </div>
            <div class="giftcard-item gc-apple" onclick="simularCanje('Apple', 50)">
                <h3 style="margin-bottom: 5px;">Apple</h3>
                <p style="font-size: 14px;">$50.00</p>
            </div>
            <div class="giftcard-item gc-visa" onclick="simularCanje('Visa Prepago', 100)">
                <h3 style="margin-bottom: 5px;">Visa Prepago</h3>
                <p style="font-size: 14px;">$100.00</p>
            </div>
        </div>

        <nav class="nav-bar">
            <div class="nav-item active">💳</div>
            <div class="nav-item">🎁</div>
            <div class="nav-item">⚙️</div>
        </nav>
    </div>

    <script>
        // Función para leer el dinero que envió CRYPTO.CASH
        function actualizarSaldo() {
            let saldoGuardado = localStorage.getItem('saldo_rewards');
            if(saldoGuardado) {
                document.getElementById('rewards-balance').innerText = parseFloat(saldoGuardado).toFixed(2);
            }
        }

        // Ejecutar al abrir la app
        actualizarSaldo();

        // Simular compra de Gift Card (Descuenta de esta app)
        function simularCanje(tienda, costo) {
            let saldoActual = parseFloat(localStorage.getItem('saldo_rewards') || '0');
            if(saldoActual >= costo) {
                saldoActual -= costo;
                localStorage.setItem('saldo_rewards', saldoActual);
                actualizarSaldo();
                alert(`¡Éxito! Has canjeado una Gift Card de ${tienda} por $${costo}. Revisa tu correo.`);
            } else {
                alert(`No tienes fondos suficientes. Necesitas $${costo}.`);
            }
        }
    </script>
</body>
</html>
